name: sync-upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$(gh api repos/chen08209/FlClash/releases/latest --jq '.tag_name')" >> "$GITHUB_OUTPUT"

      - name: Sync code and tag the fork
        id: prepare
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/chen08209/FlClash.git
          git fetch --no-tags upstream main
          git checkout -B main origin/main

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if ! git merge --no-edit -m "Merge upstream main" upstream/main; then
              echo "::error::Conflicts with the fork build customizations: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort || true
              exit 1
            fi
            git push origin main:main
          fi

          if git rev-parse -q --verify "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Already released $UPSTREAM_TAG."
            exit 0
          fi

          # Tag the fork commit, not the upstream one: the tag must carry the
          # local application id and the arm64-only build configuration.
          git tag "$UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger the release build
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: gh workflow run build --ref "$TAG"
