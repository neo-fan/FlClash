name: sync-upstream

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$(gh api repos/chen08209/FlClash/releases/latest --jq '.tag_name')" >> "$GITHUB_OUTPUT"

      - name: Sync code and tag the fork
        id: prepare
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # .gitattributes keeps this side of build.yaml and release_template.md;
          # without the driver git treats those two files as a conflict.
          git config merge.ours.driver true
          git remote add upstream https://github.com/chen08209/FlClash.git 2>/dev/null || true
          git fetch --no-tags upstream main
          git checkout -B main origin/main

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if ! git merge --no-edit -m "Merge upstream main" upstream/main; then
              echo "conflict=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 1
            fi
            git push origin main:main
          fi

          if git rev-parse -q --verify "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Already released $UPSTREAM_TAG."
            exit 0
          fi

          # Tag the fork commit, not the upstream one: the tag must carry the
          # local application id and the arm64-only build configuration.
          git tag "$UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger the release build
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: gh workflow run build --ref "$TAG"

      # A conflict or a failed dispatch used to stop the daily sync silently,
      # which is how the fork sat a release behind without anyone noticing.
      - name: Report a failed sync
        if: failure()
        env:
          CONFLICT: ${{ steps.prepare.outputs.conflict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${CONFLICT:-}" ]; then
            reason="Merging upstream/main conflicts in: ${CONFLICT}"
          else
            reason='The run failed before it could tag or start the build; see the step log.'
          fi
          {
            echo '### Upstream sync is blocked'
            echo
            echo "$reason"
            echo
            echo "Run: $RUN_URL"
            echo
            echo 'Resolve it by hand, then this job resumes on its own.'
            echo
            echo 'If starting the build answered 422 `Actions has been disabled`, that is the fork activation flag: turn Actions off and on again in Settings, Actions, General.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Upstream sync is blocked::See the job summary and step log.'