name: sync-upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and bump version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/chen08209/FlClash.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Upstream has no new commits.'
            exit 0
          fi

          git checkout -B sync/upstream origin/main
          if ! git merge --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git merge --abort || true
            echo "::error::Upstream conflicts with the fork customizations: $conflicts"
            echo '::error::Resolve the merge by hand and push sync/upstream yourself.'
            exit 1
          fi

          bash tool/bump_version.sh all
          version="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          git add pubspec.yaml
          git commit -m "chore(release): v$version"
          git push --force-with-lease origin sync/upstream:sync/upstream
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          title="Sync upstream and release v$VERSION"
          body="Automated upstream sync and version bump. Merging into main builds the arm64 APK and publishes a GitHub Release."
          if [ "$(gh pr list --head sync/upstream --base main --state open --json number --jq 'length')" = '0' ]; then
            gh pr create --head sync/upstream --base main --title "$title" --body "$body"
          else
            gh pr edit sync/upstream --title "$title" --body "$body"
          fi
